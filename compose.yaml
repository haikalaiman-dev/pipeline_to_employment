services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args: { UID: "${UID:-1000}" }
    working_dir: /work
    command: uvicorn dashboard.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir dashboard/api
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DASHBOARD_REPO: /work
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
      HEADED: "${HEADED:-0}"
      # WSLg passthrough so /browser/login can open a real Chromium window on the Windows desktop
      DISPLAY: "${DISPLAY:-:0}"
      WAYLAND_DISPLAY: "${WAYLAND_DISPLAY:-}"
      XDG_RUNTIME_DIR: /mnt/wslg/runtime-dir
      PULSE_SERVER: /mnt/wslg/PulseServer
    volumes:
      - .:/work                       # the repo root IS the state store
      - claude_home:/home/app         # ~/.claude sessions + ~/.claude.json persist across restarts
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    working_dir: /app
    ports: ["3000:3000"]
    environment:
      API_URL: http://api:8000
      WATCHPACK_POLLING: "true"       # file watching over a WSL bind mount
    volumes:
      - ./dashboard/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  claude_home: {}
  web_node_modules: {}
