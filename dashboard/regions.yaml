# Region registry for the Hunt stage. Edit here or in the dashboard (Hunt > region > Edit, or New region).
# A region = which portal CLIs to run, with which per-portal flags and locations, and its search queries.
# Ships blank on purpose: no queries and no country. Fill queries by hand, or from your profile on the
# Import page ("Tailor hunt to my profile"). Portal flag names are the CLI's own flags
# (see .agents/skills/<skill>/SKILL.md); `true` means a bare flag.
regions:
  - id: remote
    label: Remote
    queries: []
    portals:
      - skill: linkedin-search
        locations: [Remote]
        flags: {jobage: 14, remote: remote, limit: 10}
      - skill: freehire-search
        flags: {region: global, remote: remote, jobage: 14, limit: 25, no-description: true}

